[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authgebra"
version = "0.1.0"
description = "Official Python client for the Authgebra /api/v1 HTTP API (thin wrapper; performs no authorization computation)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/iwen-conf/authgebra-sdks"
Releases = "https://github.com/iwen-conf/authgebra-sdks/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authgebra = ["py.typed"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
